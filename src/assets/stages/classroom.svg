<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" aria-label="학교 교실 일러스트">
  <defs>
    <linearGradient id="cl-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6E4"/>
      <stop offset="1" stop-color="#F0E1C7"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1600" height="900" fill="url(#cl-wall)"/>
  <rect x="0" y="780" width="1600" height="120" fill="#C8A57B"/>
  <rect x="60" y="50" width="1480" height="40" fill="#7a5b3a"/>

  <!-- 셀 0 — 교과서 (教) -->
  <g transform="translate(90,90)">
    <rect x="0" y="0" width="240" height="260" rx="18" fill="#fff" opacity="0.95" stroke="#2D3047" stroke-width="3"/>
    <rect x="40" y="60" width="160" height="120" rx="4" fill="#E63946"/>
    <rect x="50" y="70" width="140" height="100" fill="#fff"/>
    <text x="120" y="120" text-anchor="middle" font-family="'Jua', sans-serif" font-size="36" fill="#2D3047">국어</text>
    <text x="120" y="155" text-anchor="middle" font-family="'Gowun Dodum', sans-serif" font-size="14" fill="#2D3047">1-1</text>
    <text x="120" y="240" text-anchor="middle" font-family="'Gowun Dodum', sans-serif" font-size="22" fill="#2D3047">교과서</text>
  </g>

  <!-- 셀 1 — 등교 가방 (校) -->
  <g transform="translate(385,90)">
    <rect x="0" y="0" width="240" height="260" rx="18" fill="#fff" opacity="0.95" stroke="#2D3047" stroke-width="3"/>
    <rect x="60" y="60" width="120" height="130" rx="14" fill="#6BCAB8" stroke="#2D3047" stroke-width="3"/>
    <rect x="78" y="80" width="84"  height="50"  rx="6"  fill="#A8E6CF"/>
    <path d="M 80,60 Q 120,30 160,60" stroke="#2D3047" stroke-width="6" fill="none"/>
    <text x="120" y="240" text-anchor="middle" font-family="'Gowun Dodum', sans-serif" font-size="22" fill="#2D3047">등교</text>
  </g>

  <!-- 셀 2 — 학생 (學) -->
  <g transform="translate(680,90)">
    <rect x="0" y="0" width="240" height="260" rx="18" fill="#fff" opacity="0.95" stroke="#2D3047" stroke-width="3"/>
    <circle cx="120" cy="80" r="34" fill="#FFE0BD"/>
    <path d="M 86,75 Q 120,42 154,75" fill="#2D3047"/>
    <circle cx="108" cy="83" r="4" fill="#2D3047"/>
    <circle cx="132" cy="83" r="4" fill="#2D3047"/>
    <path d="M 110,98 Q 120,107 130,98" stroke="#2D3047" stroke-width="3" fill="none" stroke-linecap="round"/>
    <rect x="70" y="120" width="100" height="80" rx="8" fill="#1B5FA3"/>
    <rect x="100" y="120" width="40" height="20" fill="#FFD166"/>
    <text x="120" y="240" text-anchor="middle" font-family="'Gowun Dodum', sans-serif" font-size="22" fill="#2D3047">학생</text>
  </g>

  <!-- 셀 3 — 인생 액자 (生) -->
  <g transform="translate(975,90)">
    <rect x="0" y="0" width="240" height="260" rx="18" fill="#fff" opacity="0.95" stroke="#2D3047" stroke-width="3"/>
    <rect x="40" y="50" width="160" height="150" rx="6" fill="#FFE4E1" stroke="#2D3047" stroke-width="3"/>
    <text x="120" y="100" text-anchor="middle" font-family="'Jua', sans-serif" font-size="34" fill="#E63946">人生</text>
    <text x="120" y="140" text-anchor="middle" font-family="'Gowun Dodum', sans-serif" font-size="16" fill="#2D3047">인생</text>
    <text x="120" y="175" text-anchor="middle" font-family="'Gowun Dodum', sans-serif" font-size="13" fill="#7a7a7a">살아가는 일</text>
    <text x="120" y="240" text-anchor="middle" font-family="'Gowun Dodum', sans-serif" font-size="22" fill="#2D3047">인생</text>
  </g>

  <!-- 셀 4 — 화장실 표지 (室) -->
  <g transform="translate(1270,90)">
    <rect x="0" y="0" width="240" height="260" rx="18" fill="#fff" opacity="0.95" stroke="#2D3047" stroke-width="3"/>
    <rect x="40" y="50" width="160" height="150" rx="10" fill="#1B5FA3"/>
    <circle cx="85" cy="100" r="12" fill="#fff"/>
    <rect x="73" y="115" width="24" height="40" fill="#fff"/>
    <circle cx="155" cy="100" r="12" fill="#fff"/>
    <polygon points="143,115 167,115 175,165 135,165" fill="#fff"/>
    <text x="120" y="190" text-anchor="middle" font-family="'Jua', sans-serif" font-size="14" fill="#fff">WC</text>
    <text x="120" y="240" text-anchor="middle" font-family="'Gowun Dodum', sans-serif" font-size="22" fill="#2D3047">화장실</text>
  </g>

  <!-- 셀 5 — 선생님 (先) -->
  <g transform="translate(90,500)">
    <rect x="0" y="0" width="240" height="260" rx="18" fill="#fff" opacity="0.95" stroke="#2D3047" stroke-width="3"/>
    <circle cx="120" cy="80" r="32" fill="#FFE0BD"/>
    <path d="M 88,70 Q 120,40 152,70 Q 145,55 120,52 Q 95,55 88,70" fill="#5a3a2a"/>
    <circle cx="108" cy="82" r="9" fill="none" stroke="#2D3047" stroke-width="2"/>
    <circle cx="132" cy="82" r="9" fill="none" stroke="#2D3047" stroke-width="2"/>
    <line x1="117" y1="82" x2="123" y2="82" stroke="#2D3047" stroke-width="2"/>
    <path d="M 110,100 Q 120,108 130,100" stroke="#2D3047" stroke-width="2" fill="none" stroke-linecap="round"/>
    <rect x="75" y="115" width="90" height="80" rx="6" fill="#A8DADC"/>
    <text x="120" y="240" text-anchor="middle" font-family="'Gowun Dodum', sans-serif" font-size="22" fill="#2D3047">선생</text>
  </g>

  <!-- 셀 6 — 형 사진 (兄) -->
  <g transform="translate(385,500)">
    <rect x="0" y="0" width="240" height="260" rx="18" fill="#fff" opacity="0.95" stroke="#2D3047" stroke-width="3"/>
    <rect x="40" y="40" width="160" height="170" fill="#FFD166" stroke="#7a5b3a" stroke-width="6"/>
    <circle cx="120" cy="105" r="34" fill="#FFE0BD"/>
    <path d="M 86,100 Q 120,68 154,100" fill="#2D3047"/>
    <circle cx="108" cy="108" r="3" fill="#2D3047"/>
    <circle cx="132" cy="108" r="3" fill="#2D3047"/>
    <path d="M 105,125 Q 120,135 135,125" stroke="#2D3047" stroke-width="3" fill="none" stroke-linecap="round"/>
    <rect x="78" y="142" width="84" height="50" rx="6" fill="#1B5FA3"/>
    <text x="120" y="240" text-anchor="middle" font-family="'Gowun Dodum', sans-serif" font-size="22" fill="#2D3047">형님</text>
  </g>

  <!-- 셀 7 — 제자 명찰 (弟) -->
  <g transform="translate(680,500)">
    <rect x="0" y="0" width="240" height="260" rx="18" fill="#fff" opacity="0.95" stroke="#2D3047" stroke-width="3"/>
    <rect x="40" y="60"  width="160" height="120" rx="10" fill="#FFD166" stroke="#2D3047" stroke-width="3"/>
    <rect x="55" y="76"  width="130" height="22"  fill="#E63946"/>
    <text x="120" y="93"  text-anchor="middle" font-family="'Jua', sans-serif" font-size="14" fill="#fff">학교</text>
    <text x="120" y="138" text-anchor="middle" font-family="'Jua', sans-serif" font-size="30" fill="#2D3047">제자</text>
    <circle cx="60" cy="50" r="5" fill="#2D3047"/>
    <text x="120" y="240" text-anchor="middle" font-family="'Gowun Dodum', sans-serif" font-size="22" fill="#2D3047">제자</text>
  </g>

  <!-- 셀 8 — 국기 (國) -->
  <g transform="translate(975,500)">
    <rect x="0" y="0" width="240" height="260" rx="18" fill="#fff" opacity="0.95" stroke="#2D3047" stroke-width="3"/>
    <rect x="113" y="40" width="14" height="180" fill="#7a5b3a"/>
    <rect x="40" y="50" width="80" height="60" fill="#fff" stroke="#2D3047" stroke-width="2"/>
    <circle cx="80" cy="80" r="22" fill="#E63946"/>
    <path d="M 80,58 A 11,11 0 0,1 80,80 A 11,11 0 0,0 80,102" fill="#1B5FA3"/>
    <text x="120" y="240" text-anchor="middle" font-family="'Gowun Dodum', sans-serif" font-size="22" fill="#2D3047">국기</text>
  </g>

  <!-- 셀 9 — 한글 포스터 (韓) -->
  <g transform="translate(1270,500)">
    <rect x="0" y="0" width="240" height="260" rx="18" fill="#fff" opacity="0.95" stroke="#2D3047" stroke-width="3"/>
    <rect x="30" y="40" width="180" height="170" rx="6" fill="#A8DADC" stroke="#2D3047" stroke-width="3"/>
    <text x="120" y="115" text-anchor="middle" font-family="'Jua', sans-serif" font-size="56" fill="#2D3047">한글</text>
    <text x="120" y="165" text-anchor="middle" font-family="'Gowun Dodum', sans-serif" font-size="16" fill="#2D3047">ㄱ ㄴ ㄷ ㄹ ㅁ ㅂ ㅅ</text>
    <text x="120" y="240" text-anchor="middle" font-family="'Gowun Dodum', sans-serif" font-size="22" fill="#2D3047">한글</text>
  </g>
</svg>
