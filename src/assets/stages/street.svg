<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" aria-label="거리 사건 일러스트">
  <defs>
    <linearGradient id="rd-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B0C4DE"/>
      <stop offset="1" stop-color="#778899"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1600" height="900" fill="url(#rd-sky)"/>
  <rect x="0" y="780" width="1600" height="120" fill="#4a4a4a"/>
  <g stroke="#FFD166" stroke-width="4" stroke-dasharray="20 14" opacity="0.7">
    <line x1="0" y1="840" x2="1600" y2="840"/>
  </g>

  <!-- 셀 0 — 대문 (門) -->
  <g transform="translate(90,90)">
    <rect x="0" y="0" width="240" height="260" rx="18" fill="#fff" opacity="0.95" stroke="#2D3047" stroke-width="3"/>
    <rect x="30" y="50" width="180" height="160" fill="#8B5A2B" stroke="#2D3047" stroke-width="4"/>
    <line x1="120" y1="50" x2="120" y2="210" stroke="#2D3047" stroke-width="4"/>
    <rect x="50"  y="80"  width="60" height="60" fill="#A0743F"/>
    <rect x="130" y="80"  width="60" height="60" fill="#A0743F"/>
    <circle cx="105" cy="170" r="6" fill="#FFD166"/>
    <circle cx="135" cy="170" r="6" fill="#FFD166"/>
    <text x="120" y="240" text-anchor="middle" font-family="'Gowun Dodum', sans-serif" font-size="22" fill="#2D3047">대문</text>
  </g>

  <!-- 셀 1 — 외출 가방 (外) -->
  <g transform="translate(385,90)">
    <rect x="0" y="0" width="240" height="260" rx="18" fill="#fff" opacity="0.95" stroke="#2D3047" stroke-width="3"/>
    <path d="M 70,75 Q 70,55 90,55 L 150,55 Q 170,55 170,75" stroke="#2D3047" stroke-width="6" fill="none"/>
    <rect x="50" y="75" width="140" height="120" rx="10" fill="#A6311F" stroke="#2D3047" stroke-width="3"/>
    <rect x="105" y="110" width="30" height="20" rx="3" fill="#FFD166"/>
    <text x="120" y="240" text-anchor="middle" font-family="'Gowun Dodum', sans-serif" font-size="22" fill="#2D3047">외출</text>
  </g>

  <!-- 셀 2 — 공중전화 (電) -->
  <g transform="translate(680,90)">
    <rect x="0" y="0" width="240" height="260" rx="18" fill="#fff" opacity="0.95" stroke="#2D3047" stroke-width="3"/>
    <rect x="60" y="40"  width="120" height="170" rx="8" fill="#E63946" stroke="#2D3047" stroke-width="3"/>
    <rect x="75" y="60"  width="90"  height="80"  fill="#FFE4B5"/>
    <rect x="85" y="155" width="70"  height="40"  rx="6" fill="#fff"/>
    <text x="120" y="105" text-anchor="middle" font-family="'Jua', sans-serif" font-size="24" fill="#2D3047">전화</text>
    <circle cx="100" cy="175" r="4" fill="#2D3047"/>
    <circle cx="120" cy="175" r="4" fill="#2D3047"/>
    <circle cx="140" cy="175" r="4" fill="#2D3047"/>
    <text x="120" y="240" text-anchor="middle" font-family="'Gowun Dodum', sans-serif" font-size="22" fill="#2D3047">전화</text>
  </g>

  <!-- 셀 3 — 말풍선 (話) -->
  <g transform="translate(975,90)">
    <rect x="0" y="0" width="240" height="260" rx="18" fill="#fff" opacity="0.95" stroke="#2D3047" stroke-width="3"/>
    <path d="M 30,80 Q 30,50 60,50 L 180,50 Q 210,50 210,80 L 210,140 Q 210,170 180,170 L 100,170 L 70,200 L 80,170 L 60,170 Q 30,170 30,140 Z"
          fill="#A8DADC" stroke="#2D3047" stroke-width="3"/>
    <text x="120" y="120" text-anchor="middle" font-family="'Jua', sans-serif" font-size="22" fill="#2D3047">안녕!</text>
    <text x="120" y="240" text-anchor="middle" font-family="'Gowun Dodum', sans-serif" font-size="22" fill="#2D3047">대화</text>
  </g>

  <!-- 셀 4 — 기록 게시판 (記) -->
  <g transform="translate(1270,90)">
    <rect x="0" y="0" width="240" height="260" rx="18" fill="#fff" opacity="0.95" stroke="#2D3047" stroke-width="3"/>
    <rect x="30" y="40" width="180" height="170" fill="#8B5A2B" stroke="#2D3047" stroke-width="4"/>
    <rect x="40" y="50" width="160" height="150" fill="#F4E4BC"/>
    <g stroke="#2D3047" stroke-width="1.5" opacity="0.8">
      <line x1="55" y1="75"  x2="185" y2="75"/>
      <line x1="55" y1="105" x2="185" y2="105"/>
      <line x1="55" y1="135" x2="185" y2="135"/>
      <line x1="55" y1="165" x2="185" y2="165"/>
    </g>
    <text x="120" y="195" text-anchor="middle" font-family="'Jua', sans-serif" font-size="14" fill="#E63946">기록 게시판</text>
    <text x="120" y="240" text-anchor="middle" font-family="'Gowun Dodum', sans-serif" font-size="22" fill="#2D3047">기록</text>
  </g>

  <!-- 셀 5 — 생활 포스터 (活) -->
  <g transform="translate(90,500)">
    <rect x="0" y="0" width="240" height="260" rx="18" fill="#fff" opacity="0.95" stroke="#2D3047" stroke-width="3"/>
    <rect x="30" y="40" width="180" height="170" rx="6" fill="#6BCAB8" stroke="#2D3047" stroke-width="3"/>
    <text x="120" y="100" text-anchor="middle" font-family="'Jua', sans-serif" font-size="42" fill="#fff">생활</text>
    <text x="120" y="145" text-anchor="middle" font-family="'Gowun Dodum', sans-serif" font-size="14" fill="#fff">건강한 매일</text>
    <text x="120" y="180" text-anchor="middle" font-family="'Jua', sans-serif" font-size="20" fill="#FFD166">★ ★ ★</text>
    <text x="120" y="240" text-anchor="middle" font-family="'Gowun Dodum', sans-serif" font-size="22" fill="#2D3047">생활</text>
  </g>

  <!-- 셀 6 — 왕자 동상 (王) -->
  <g transform="translate(385,500)">
    <rect x="0" y="0" width="240" height="260" rx="18" fill="#fff" opacity="0.95" stroke="#2D3047" stroke-width="3"/>
    <rect x="50" y="180" width="140" height="30" fill="#A8A8A8"/>
    <!-- 왕관 -->
    <polygon points="90,60 100,40 110,60 120,40 130,60 140,40 150,60 150,75 90,75" fill="#FFD166" stroke="#2D3047" stroke-width="2"/>
    <circle cx="100" cy="48" r="3" fill="#E63946"/>
    <circle cx="120" cy="48" r="3" fill="#E63946"/>
    <circle cx="140" cy="48" r="3" fill="#E63946"/>
    <circle cx="120" cy="105" r="22" fill="#FFE0BD"/>
    <rect x="100" y="125" width="40" height="60" fill="#A6311F"/>
    <text x="120" y="240" text-anchor="middle" font-family="'Gowun Dodum', sans-serif" font-size="22" fill="#2D3047">왕자</text>
  </g>

  <!-- 셀 7 — 북쪽 표지 (北) -->
  <g transform="translate(680,500)">
    <rect x="0" y="0" width="240" height="260" rx="18" fill="#fff" opacity="0.95" stroke="#2D3047" stroke-width="3"/>
    <circle cx="120" cy="115" r="80" fill="#fff" stroke="#2D3047" stroke-width="4"/>
    <polygon points="120,45 100,115 140,115" fill="#E63946"/>
    <polygon points="120,185 100,115 140,115" fill="#fff" stroke="#2D3047" stroke-width="2"/>
    <text x="120" y="35"  text-anchor="middle" font-family="'Jua', sans-serif" font-size="20" fill="#E63946">N</text>
    <text x="120" y="210" text-anchor="middle" font-family="'Jua', sans-serif" font-size="14" fill="#2D3047">S</text>
    <text x="120" y="240" text-anchor="middle" font-family="'Gowun Dodum', sans-serif" font-size="22" fill="#2D3047">북쪽</text>
  </g>

  <!-- 셀 8 — 남쪽 표지 (南) -->
  <g transform="translate(975,500)">
    <rect x="0" y="0" width="240" height="260" rx="18" fill="#fff" opacity="0.95" stroke="#2D3047" stroke-width="3"/>
    <circle cx="120" cy="115" r="80" fill="#fff" stroke="#2D3047" stroke-width="4"/>
    <polygon points="120,45 100,115 140,115" fill="#fff" stroke="#2D3047" stroke-width="2"/>
    <polygon points="120,185 100,115 140,115" fill="#1B5FA3"/>
    <text x="120" y="35"  text-anchor="middle" font-family="'Jua', sans-serif" font-size="14" fill="#2D3047">N</text>
    <text x="120" y="210" text-anchor="middle" font-family="'Jua', sans-serif" font-size="20" fill="#1B5FA3">S</text>
    <text x="120" y="240" text-anchor="middle" font-family="'Gowun Dodum', sans-serif" font-size="22" fill="#2D3047">남쪽</text>
  </g>

  <!-- 셀 9 — 족발 간판 (足) -->
  <g transform="translate(1270,500)">
    <rect x="0" y="0" width="240" height="260" rx="18" fill="#fff" opacity="0.95" stroke="#2D3047" stroke-width="3"/>
    <rect x="30" y="40" width="180" height="100" rx="8" fill="#E63946" stroke="#2D3047" stroke-width="3"/>
    <text x="120" y="100" text-anchor="middle" font-family="'Jua', sans-serif" font-size="44" fill="#FFD166">족발</text>
    <!-- 족발 그림 (단순) -->
    <ellipse cx="120" cy="170" rx="50" ry="22" fill="#C8845C"/>
    <ellipse cx="100" cy="165" rx="14" ry="10" fill="#A0743F"/>
    <ellipse cx="140" cy="165" rx="14" ry="10" fill="#A0743F"/>
    <text x="120" y="240" text-anchor="middle" font-family="'Gowun Dodum', sans-serif" font-size="22" fill="#2D3047">족발</text>
  </g>
</svg>
