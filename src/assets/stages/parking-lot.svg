<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" aria-label="주차장 사건 일러스트">
  <defs>
    <linearGradient id="pk-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#87CEEB"/>
      <stop offset="0.7" stop-color="#FFE4B5"/>
      <stop offset="1"   stop-color="#FFD166"/>
    </linearGradient>
    <linearGradient id="pk-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4a4a"/>
      <stop offset="1" stop-color="#2a2a2a"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0"   width="1600" height="480" fill="url(#pk-sky)"/>
  <rect x="0" y="480" width="1600" height="420" fill="url(#pk-ground)"/>

  <circle cx="200" cy="120" r="50" fill="#FFD166" opacity="0.9"/>
  <ellipse cx="600"  cy="100" rx="70" ry="18" fill="#fff" opacity="0.85"/>
  <ellipse cx="1200" cy="140" rx="90" ry="22" fill="#fff" opacity="0.85"/>

  <g opacity="0.7">
    <rect x="40"   y="320" width="200" height="160" fill="#6b6e82"/>
    <rect x="260"  y="350" width="160" height="130" fill="#4a4d5a"/>
    <rect x="1380" y="310" width="180" height="170" fill="#6b6e82"/>
    <rect x="1200" y="340" width="160" height="140" fill="#4a4d5a"/>
  </g>

  <g stroke="#fff" stroke-width="4" opacity="0.45">
    <line x1="40"   y1="870" x2="1560" y2="870"/>
  </g>

  <!-- 셀 0 — 자동차 (車) -->
  <g transform="translate(90,90)">
    <rect x="0" y="0" width="240" height="260" rx="18" fill="#FFF6E4" opacity="0.92" stroke="#2D3047" stroke-width="3"/>
    <rect x="20"  y="115" width="200" height="65"  rx="14" fill="#E63946"/>
    <rect x="50"  y="75"  width="140" height="50"  rx="16" fill="#E63946"/>
    <rect x="62"  y="86"  width="55"  height="32"  fill="#A8DADC" opacity="0.9"/>
    <rect x="125" y="86"  width="55"  height="32"  fill="#A8DADC" opacity="0.9"/>
    <circle cx="62"  cy="190" r="22" fill="#1D3557"/>
    <circle cx="62"  cy="190" r="9"  fill="#A8DADC"/>
    <circle cx="178" cy="190" r="22" fill="#1D3557"/>
    <circle cx="178" cy="190" r="9"  fill="#A8DADC"/>
    <text x="120" y="240" text-anchor="middle" font-family="'Gowun Dodum', sans-serif" font-size="22" fill="#2D3047">자동차</text>
  </g>

  <!-- 셀 1 — P 표지판 (場) -->
  <g transform="translate(385,90)">
    <rect x="0" y="0" width="240" height="260" rx="18" fill="#FFF6E4" opacity="0.92" stroke="#2D3047" stroke-width="3"/>
    <rect x="105" y="170" width="30" height="80" fill="#7a7a7a"/>
    <rect x="40"  y="50"  width="160" height="130" rx="10" fill="#1B5FA3"/>
    <text x="120" y="155" text-anchor="middle" font-family="'Jua', sans-serif" font-size="100" fill="#fff">P</text>
    <text x="120" y="240" text-anchor="middle" font-family="'Gowun Dodum', sans-serif" font-size="22" fill="#2D3047">주차장</text>
  </g>

  <!-- 셀 2 — 차도 (道) -->
  <g transform="translate(680,90)">
    <rect x="0" y="0" width="240" height="260" rx="18" fill="#FFF6E4" opacity="0.92" stroke="#2D3047" stroke-width="3"/>
    <rect x="40" y="60"  width="160" height="140" fill="#2D3047"/>
    <g stroke="#FFD166" stroke-width="6" stroke-dasharray="14 10">
      <line x1="120" y1="60" x2="120" y2="200"/>
    </g>
    <rect x="40" y="60"  width="160" height="6"  fill="#fff"/>
    <rect x="40" y="194" width="160" height="6"  fill="#fff"/>
    <text x="120" y="240" text-anchor="middle" font-family="'Gowun Dodum', sans-serif" font-size="22" fill="#2D3047">차도</text>
  </g>

  <!-- 셀 3 — 운동 표지 (動) -->
  <g transform="translate(975,90)">
    <rect x="0" y="0" width="240" height="260" rx="18" fill="#FFF6E4" opacity="0.92" stroke="#2D3047" stroke-width="3"/>
    <circle cx="120" cy="115" r="78" fill="#FFD166" stroke="#2D3047" stroke-width="4"/>
    <circle cx="120" cy="80" r="14" fill="#2D3047"/>
    <path d="M 100,100 L 120,140 L 95,170 M 120,140 L 145,165 M 120,110 L 145,95 M 120,110 L 100,118" stroke="#2D3047" stroke-width="9" stroke-linecap="round" fill="none"/>
    <text x="120" y="240" text-anchor="middle" font-family="'Gowun Dodum', sans-serif" font-size="22" fill="#2D3047">운동</text>
  </g>

  <!-- 셀 4 — 전기차 충전기 (力) -->
  <g transform="translate(1270,90)">
    <rect x="0" y="0" width="240" height="260" rx="18" fill="#FFF6E4" opacity="0.92" stroke="#2D3047" stroke-width="3"/>
    <rect x="80"  y="60"  width="80" height="140" rx="12" fill="#6BCAB8" stroke="#2D3047" stroke-width="3"/>
    <rect x="92"  y="78"  width="56" height="34"  rx="4" fill="#2D3047"/>
    <text x="120" y="103" text-anchor="middle" font-family="'Jua', sans-serif" font-size="22" fill="#FFD166">EV</text>
    <path d="M 110,140 L 100,160 L 122,160 L 118,175" stroke="#FFD166" stroke-width="5" fill="none" stroke-linecap="round"/>
    <text x="120" y="240" text-anchor="middle" font-family="'Gowun Dodum', sans-serif" font-size="22" fill="#2D3047">동력</text>
  </g>

  <!-- 셀 5 — 국립공원 안내 (立) -->
  <g transform="translate(90,500)">
    <rect x="0" y="0" width="240" height="260" rx="18" fill="#FFF6E4" opacity="0.92" stroke="#2D3047" stroke-width="3"/>
    <rect x="40" y="40" width="160" height="120" rx="10" fill="#4a7c59" stroke="#2D3047" stroke-width="3"/>
    <text x="120" y="90"  text-anchor="middle" font-family="'Jua', sans-serif" font-size="34" fill="#fff">국립</text>
    <text x="120" y="128" text-anchor="middle" font-family="'Gowun Dodum', sans-serif" font-size="18" fill="#fff">공원</text>
    <rect x="113" y="160" width="14" height="50" fill="#7a5b3a"/>
    <text x="120" y="240" text-anchor="middle" font-family="'Gowun Dodum', sans-serif" font-size="22" fill="#2D3047">국립</text>
  </g>

  <!-- 셀 6 — 방향 안내판 (方) -->
  <g transform="translate(385,500)">
    <rect x="0" y="0" width="240" height="260" rx="18" fill="#FFF6E4" opacity="0.92" stroke="#2D3047" stroke-width="3"/>
    <rect x="113" y="120" width="14" height="90" fill="#7a5b3a"/>
    <polygon points="40,80 165,80 195,110 165,140 40,140" fill="#FFD166" stroke="#2D3047" stroke-width="3"/>
    <text x="100" y="120" text-anchor="middle" font-family="'Jua', sans-serif" font-size="22" fill="#2D3047">⇨ 동</text>
    <text x="120" y="240" text-anchor="middle" font-family="'Gowun Dodum', sans-serif" font-size="22" fill="#2D3047">방향</text>
  </g>

  <!-- 셀 7 — 자전거 (自) -->
  <g transform="translate(680,500)">
    <rect x="0" y="0" width="240" height="260" rx="18" fill="#FFF6E4" opacity="0.92" stroke="#2D3047" stroke-width="3"/>
    <circle cx="65"  cy="160" r="40" fill="none" stroke="#2D3047" stroke-width="6"/>
    <circle cx="175" cy="160" r="40" fill="none" stroke="#2D3047" stroke-width="6"/>
    <line x1="65"  y1="160" x2="120" y2="100" stroke="#2D3047" stroke-width="6"/>
    <line x1="175" y1="160" x2="120" y2="100" stroke="#2D3047" stroke-width="6"/>
    <line x1="65"  y1="160" x2="175" y2="160" stroke="#2D3047" stroke-width="6"/>
    <line x1="120" y1="100" x2="155" y2="80"  stroke="#2D3047" stroke-width="6"/>
    <line x1="65"  y1="160" x2="95"  y2="80"  stroke="#2D3047" stroke-width="6"/>
    <rect x="85"  y="70"  width="20" height="14" fill="#2D3047"/>
    <text x="120" y="240" text-anchor="middle" font-family="'Gowun Dodum', sans-serif" font-size="22" fill="#2D3047">자전거</text>
  </g>

  <!-- 셀 8 — 안전 표지 (全) -->
  <g transform="translate(975,500)">
    <rect x="0" y="0" width="240" height="260" rx="18" fill="#FFF6E4" opacity="0.92" stroke="#2D3047" stroke-width="3"/>
    <polygon points="120,40 200,180 40,180" fill="#FFD166" stroke="#2D3047" stroke-width="4"/>
    <text x="120" y="160" text-anchor="middle" font-family="'Jua', sans-serif" font-size="60" fill="#2D3047">!</text>
    <text x="120" y="240" text-anchor="middle" font-family="'Gowun Dodum', sans-serif" font-size="22" fill="#2D3047">안전</text>
  </g>

  <!-- 셀 9 — 공사 (工) -->
  <g transform="translate(1270,500)">
    <rect x="0" y="0" width="240" height="260" rx="18" fill="#FFF6E4" opacity="0.92" stroke="#2D3047" stroke-width="3"/>
    <polygon points="120,60 75,200 165,200" fill="#FF8C00" stroke="#2D3047" stroke-width="3"/>
    <rect x="80"  y="100" width="80" height="12" fill="#fff"/>
    <rect x="78"  y="135" width="84" height="12" fill="#fff"/>
    <rect x="60"  y="195" width="120" height="14" fill="#2D3047"/>
    <text x="120" y="240" text-anchor="middle" font-family="'Gowun Dodum', sans-serif" font-size="22" fill="#2D3047">공사</text>
  </g>
</svg>
