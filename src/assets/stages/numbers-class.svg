<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" aria-label="숫자 사건 일러스트">
  <defs>
    <linearGradient id="nc-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E6E6FA"/>
      <stop offset="1" stop-color="#AFEEEE"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1600" height="900" fill="url(#nc-wall)"/>
  <rect x="0" y="780" width="1600" height="120" fill="#C8A57B"/>
  <!-- 칠판 (배경) -->
  <rect x="60" y="30" width="1480" height="50" fill="#2c5f3f" stroke="#7a5b3a" stroke-width="4"/>
  <text x="800" y="65" text-anchor="middle" font-family="'Jua', sans-serif" font-size="32" fill="#FFD166">오늘의 숫자 수업</text>

  <!-- 셀 0 — 1등 깃발 (一) -->
  <g transform="translate(90,90)">
    <rect x="0" y="0" width="240" height="260" rx="18" fill="#fff" opacity="0.95" stroke="#2D3047" stroke-width="3"/>
    <rect x="115" y="60" width="10" height="160" fill="#7a5b3a"/>
    <polygon points="120,60 200,80 120,100" fill="#FFD166" stroke="#2D3047" stroke-width="3"/>
    <text x="160" y="88" text-anchor="middle" font-family="'Jua', sans-serif" font-size="22" fill="#E63946">1등</text>
    <text x="120" y="240" text-anchor="middle" font-family="'Gowun Dodum', sans-serif" font-size="22" fill="#2D3047">일등</text>
  </g>

  <!-- 셀 1 — 2등 깃발 (二) -->
  <g transform="translate(385,90)">
    <rect x="0" y="0" width="240" height="260" rx="18" fill="#fff" opacity="0.95" stroke="#2D3047" stroke-width="3"/>
    <rect x="115" y="60" width="10" height="160" fill="#7a5b3a"/>
    <polygon points="120,60 200,80 120,100" fill="#A8DADC" stroke="#2D3047" stroke-width="3"/>
    <text x="160" y="88" text-anchor="middle" font-family="'Jua', sans-serif" font-size="22" fill="#1B5FA3">2등</text>
    <text x="120" y="240" text-anchor="middle" font-family="'Gowun Dodum', sans-serif" font-size="22" fill="#2D3047">이등</text>
  </g>

  <!-- 셀 2 — 삼각형 (三) -->
  <g transform="translate(680,90)">
    <rect x="0" y="0" width="240" height="260" rx="18" fill="#fff" opacity="0.95" stroke="#2D3047" stroke-width="3"/>
    <polygon points="120,40 200,180 40,180" fill="#E63946" stroke="#2D3047" stroke-width="4"/>
    <text x="120" y="135" text-anchor="middle" font-family="'Jua', sans-serif" font-size="36" fill="#fff">三</text>
    <text x="120" y="240" text-anchor="middle" font-family="'Gowun Dodum', sans-serif" font-size="22" fill="#2D3047">삼각형</text>
  </g>

  <!-- 셀 3 — 달력 4월 (四) -->
  <g transform="translate(975,90)">
    <rect x="0" y="0" width="240" height="260" rx="18" fill="#fff" opacity="0.95" stroke="#2D3047" stroke-width="3"/>
    <rect x="30" y="40" width="180" height="170" fill="#fff" stroke="#2D3047" stroke-width="3"/>
    <rect x="30" y="40" width="180" height="35" fill="#E63946"/>
    <text x="120" y="65" text-anchor="middle" font-family="'Jua', sans-serif" font-size="22" fill="#fff">4월</text>
    <g font-family="'Gowun Dodum', sans-serif" font-size="14" fill="#2D3047" text-anchor="middle">
      <text x="55" y="100">월</text><text x="90" y="100">화</text><text x="125" y="100">수</text>
      <text x="160" y="100">목</text><text x="195" y="100">금</text>
      <text x="55" y="130">1</text><text x="90" y="130">2</text><text x="125" y="130">3</text>
      <text x="160" y="130">4</text><text x="195" y="130">5</text>
      <text x="55" y="160">8</text><text x="90" y="160">9</text><text x="125" y="160">10</text>
      <text x="160" y="160">11</text><text x="195" y="160">12</text>
    </g>
    <text x="120" y="240" text-anchor="middle" font-family="'Gowun Dodum', sans-serif" font-size="22" fill="#2D3047">사월</text>
  </g>

  <!-- 셀 4 — 오각형 (五) -->
  <g transform="translate(1270,90)">
    <rect x="0" y="0" width="240" height="260" rx="18" fill="#fff" opacity="0.95" stroke="#2D3047" stroke-width="3"/>
    <polygon points="120,45 195,100 170,185 70,185 45,100" fill="#FFD166" stroke="#2D3047" stroke-width="4"/>
    <text x="120" y="140" text-anchor="middle" font-family="'Jua', sans-serif" font-size="36" fill="#2D3047">五</text>
    <text x="120" y="240" text-anchor="middle" font-family="'Gowun Dodum', sans-serif" font-size="22" fill="#2D3047">오각형</text>
  </g>

  <!-- 셀 5 — 달력 6월 (六) -->
  <g transform="translate(90,500)">
    <rect x="0" y="0" width="240" height="260" rx="18" fill="#fff" opacity="0.95" stroke="#2D3047" stroke-width="3"/>
    <rect x="30" y="40" width="180" height="170" fill="#fff" stroke="#2D3047" stroke-width="3"/>
    <rect x="30" y="40" width="180" height="35" fill="#6BCAB8"/>
    <text x="120" y="65" text-anchor="middle" font-family="'Jua', sans-serif" font-size="22" fill="#fff">6월</text>
    <g font-family="'Gowun Dodum', sans-serif" font-size="14" fill="#2D3047" text-anchor="middle">
      <text x="60" y="100">일</text><text x="100" y="100">월</text><text x="140" y="100">화</text><text x="180" y="100">수</text>
      <text x="60" y="130">1</text><text x="100" y="130">2</text><text x="140" y="130">3</text><text x="180" y="130">4</text>
      <text x="60" y="160">8</text><text x="100" y="160">9</text><text x="140" y="160">10</text><text x="180" y="160">11</text>
      <text x="60" y="190">15</text><text x="100" y="190">16</text><text x="140" y="190">17</text><text x="180" y="190">18</text>
    </g>
    <text x="120" y="240" text-anchor="middle" font-family="'Gowun Dodum', sans-serif" font-size="22" fill="#2D3047">유월</text>
  </g>

  <!-- 셀 6 — 칠석 안내 (七) -->
  <g transform="translate(385,500)">
    <rect x="0" y="0" width="240" height="260" rx="18" fill="#fff" opacity="0.95" stroke="#2D3047" stroke-width="3"/>
    <rect x="30" y="40" width="180" height="170" rx="8" fill="#1F2231" stroke="#2D3047" stroke-width="3"/>
    <g fill="#FFD166">
      <polygon points="80,100 84,108 92,108 86,114 88,122 80,118 72,122 74,114 68,108 76,108"/>
      <polygon points="160,80 164,88 172,88 166,94 168,102 160,98 152,102 154,94 148,88 156,88"/>
      <polygon points="120,150 124,158 132,158 126,164 128,172 120,168 112,172 114,164 108,158 116,158"/>
    </g>
    <text x="120" y="200" text-anchor="middle" font-family="'Jua', sans-serif" font-size="22" fill="#FFD166">칠석</text>
    <text x="120" y="240" text-anchor="middle" font-family="'Gowun Dodum', sans-serif" font-size="22" fill="#2D3047">칠석</text>
  </g>

  <!-- 셀 7 — 팔도 지도 (八) -->
  <g transform="translate(680,500)">
    <rect x="0" y="0" width="240" height="260" rx="18" fill="#fff" opacity="0.95" stroke="#2D3047" stroke-width="3"/>
    <!-- 한반도 단순화 -->
    <path d="M 100,50 Q 90,80 90,110 Q 100,140 100,170 Q 105,195 130,200 Q 145,195 140,170 Q 145,140 140,110 Q 140,80 130,55 Q 115,45 100,50 Z"
          fill="#FFD166" stroke="#2D3047" stroke-width="3"/>
    <g stroke="#2D3047" stroke-width="1" opacity="0.6">
      <line x1="95"  y1="80"  x2="135" y2="80"/>
      <line x1="92"  y1="110" x2="138" y2="110"/>
      <line x1="92"  y1="140" x2="138" y2="140"/>
      <line x1="100" y1="170" x2="140" y2="170"/>
    </g>
    <text x="170" y="125" font-family="'Jua', sans-serif" font-size="18" fill="#E63946">팔도</text>
    <text x="120" y="240" text-anchor="middle" font-family="'Gowun Dodum', sans-serif" font-size="22" fill="#2D3047">팔도</text>
  </g>

  <!-- 셀 8 — 구구단 표 (九) -->
  <g transform="translate(975,500)">
    <rect x="0" y="0" width="240" height="260" rx="18" fill="#fff" opacity="0.95" stroke="#2D3047" stroke-width="3"/>
    <rect x="30" y="40" width="180" height="170" rx="6" fill="#A8DADC" stroke="#2D3047" stroke-width="3"/>
    <text x="120" y="75" text-anchor="middle" font-family="'Jua', sans-serif" font-size="22" fill="#1B5FA3">구구단</text>
    <line x1="45" y1="85" x2="195" y2="85" stroke="#1B5FA3" stroke-width="1.5"/>
    <g font-family="'Gowun Dodum', sans-serif" font-size="15" fill="#2D3047" text-anchor="middle">
      <text x="120" y="110">9 × 1 = 9</text>
      <text x="120" y="135">9 × 2 = 18</text>
      <text x="120" y="160">9 × 3 = 27</text>
      <text x="120" y="185">9 × 4 = 36</text>
    </g>
    <text x="120" y="240" text-anchor="middle" font-family="'Gowun Dodum', sans-serif" font-size="22" fill="#2D3047">구구단</text>
  </g>

  <!-- 셀 9 — 달력 10월 (十) -->
  <g transform="translate(1270,500)">
    <rect x="0" y="0" width="240" height="260" rx="18" fill="#fff" opacity="0.95" stroke="#2D3047" stroke-width="3"/>
    <rect x="30" y="40" width="180" height="170" fill="#fff" stroke="#2D3047" stroke-width="3"/>
    <rect x="30" y="40" width="180" height="35" fill="#FF8C00"/>
    <text x="120" y="65" text-anchor="middle" font-family="'Jua', sans-serif" font-size="22" fill="#fff">10월</text>
    <g font-family="'Gowun Dodum', sans-serif" font-size="14" fill="#2D3047" text-anchor="middle">
      <text x="60" y="100">월</text><text x="100" y="100">화</text><text x="140" y="100">수</text><text x="180" y="100">목</text>
      <text x="60" y="130">1</text><text x="100" y="130">2</text><text x="140" y="130">3</text><text x="180" y="130">4</text>
      <text x="60" y="160">8</text><text x="100" y="160">9</text><text x="140" y="160">10</text><text x="180" y="160">11</text>
      <text x="60" y="190">15</text><text x="100" y="190">16</text><text x="140" y="190">17</text><text x="180" y="190">18</text>
    </g>
    <text x="120" y="240" text-anchor="middle" font-family="'Gowun Dodum', sans-serif" font-size="22" fill="#2D3047">시월</text>
  </g>
</svg>
